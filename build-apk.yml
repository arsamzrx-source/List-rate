name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find site files and copy to www
        run: |
          IDX=$(find . -name index.html -not -path './node_modules/*' -not -path './android/*' -not -path './www/*' | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$IDX" ]; then echo "ERROR: index.html not found in repo"; ls -la; exit 1; fi
          SRC=$(dirname "$IDX")
          echo "Using web folder: $SRC"
          ls -la "$SRC"
          mkdir -p www
          tar -C "$SRC" \
            --exclude='./node_modules' --exclude='./android' --exclude='./www' \
            --exclude='./.git' --exclude='./.github' \
            --exclude='./package.json' --exclude='./package-lock.json' \
            --exclude='./capacitor.config.json' --exclude='./README*' \
            -cf - . | tar -C www -xf -
          test -f www/index.html
          echo "--- www content:"
          ls -la www

      - name: Install Capacitor
        run: npm install

      - name: Load Capacitor core in the page
        run: |
          python3 - <<'PY'
          import re, shutil
          shutil.copy('node_modules/@capacitor/core/dist/capacitor.js', 'www/capacitor.js')
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          inj = ('<script src="capacitor.js"></script>\n'
                 '<script>try{if(window.Capacitor&&Capacitor.registerPlugin&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){'
                 '["LocalNotifications","App"].forEach(function(n){if(!(Capacitor.Plugins&&Capacitor.Plugins[n]))Capacitor.registerPlugin(n)})}}catch(e){}</script>\n')
          if 'src="capacitor.js"' not in s:
              s = re.sub(r'<head[^>]*>', lambda m: m.group(0) + '\n' + inj, s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
          PY
          grep -c 'capacitor.js' www/index.html
          ls -la www/capacitor.js

      - name: Add Android project
        run: npx cap add android

      - name: Add notification permissions
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>#' $F
          cat $F

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: list-rate-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
